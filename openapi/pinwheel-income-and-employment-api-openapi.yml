components:
  schemas:
    TimeOffObjPublicResponseItem:
      properties:
        name:
          type: string
          title: name
          description: The name of the time off.
        category:
          allOf:
          - type: string
            enum:
            - pto
            - sick
            - other
          description: The category of the time off.
        available_hours:
          type: number
          title: available_hours
          description: The total hours of time off available, as of the pay period end date. In the event available_hours is not on the paystub, this value reflects the current available_hours at the time the paystub was retrieved.
        earned_hours:
          type: number
          title: earned_hours
          description: The hours of time off earned during the pay period.
        used_hours:
          type: number
          title: used_hours
          description: The hours of time off used during the pay period.
      type: object
      required:
      - name
      - category
      title: TimeOff
      x-tags:
      - Schemas
    RefreshableMeta:
      properties:
        refreshed_at:
          type: string
          format: date-time
          title: refreshed_at
          description: ISO 8601 timestamp of the most recent refresh of this data.
      type: object
      title: RefreshableMeta
      x-tags:
      - Schemas
    DeductionObjPublicResponseItem:
      properties:
        name:
          type: string
          title: name
          description: The name of the deduction.
        category:
          allOf:
          - type: string
            enum:
            - retirement
            - medical_insurance
            - hsa
            - fsa
            - dental
            - vision
            - life_insurance
            - disability
            - child_support
            - commuter
            - union_dues
            - stock
            - charity
            - savings
            - tips
            - wage_garnishment
            - lending
            - company_perk
            - tax
            - loan
            - job_expense
            - other
            - fees
            - reallocation
            - retro_pay
          description: The category of deduction.
        amount:
          type: integer
          title: amount
          description: The amount of deduction, in cents.
        type:
          allOf:
          - type: string
            enum:
            - pre_tax
            - post_tax
            - unknown
          description: The type of deduction.
      type: object
      required:
      - name
      - category
      - amount
      - type
      title: Deduction
      x-tags:
      - Schemas
    AddressGetResponseItem:
      properties:
        raw:
          type: string
