      required:
      - allocation_type
      - currency
      title: Allocation
      x-tags:
      - Schemas
    RefreshableMeta:
      properties:
        refreshed_at:
          type: string
          format: date-time
          title: refreshed_at
          description: ISO 8601 timestamp of the most recent refresh of this data.
      type: object
      title: RefreshableMeta
      x-tags:
      - Schemas
    DDAllocationObjResponse:
      properties:
        id:
          type: string
          format: uuid
          title: id
          description: Unique identifier of the Direct Deposit Allocations object.
        account_id:
          type: string
          format: uuid
          title: account_id
          description: UUID of the payroll account.
        created_at:
          type: string
          format: date-time
          title: created_at
          description: ISO 8601 timestamp of created time.
        updated_at:
          type: string
          format: date-time
          title: updated_at
          description: ISO 8601 timestamp of the last update to this object.
        allocations:
          items:
            $ref: '#/components/schemas/AllocationAccountObjResponse'
          type: array
          title: allocations
          description: List of current allocations for this payroll account.
      type: object
      required:
      - id
      - account_id
      - created_at
      - updated_at
      - allocations
      title: Direct Deposit Allocations
      x-tags:
      - Schemas
  securitySchemes:
    apiSecret:
      type: apiKey
      in: header
      name: X-API-SECRET
      description: API Secret
    bearerAuth:
      description: Bearer token
      type: http
      scheme: bearer
