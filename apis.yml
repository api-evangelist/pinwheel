aid: pinwheel
name: Pinwheel
description: >-
  Pinwheel is the leading payroll connectivity platform providing a REST API
  for direct deposit switching, income verification, employment history, and
  tax form retrieval from 1,800+ payroll providers and 40+ time-and-attendance
  systems. Financial institutions and fintechs use Pinwheel to activate customer
  accounts, verify income and employment, automate bill switching, and build
  primary banking relationships through a single, SOC 2 Type 2 and ISO 27001
  certified integration.
