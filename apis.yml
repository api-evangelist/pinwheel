apis:
  - name: Pinwheel API
    description: >-
      RESTful API for payroll connectivity enabling direct deposit switching,
      income and employment data access, paystub retrieval, tax form access, and
      bill switching across 1,800+ payroll platforms. Supports Deposit Switch,
      Verify, Bill Switch, Switch Kit, Bill Manager, and Taxes products via
      JSON over HTTPS with API secret key authentication.
